<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un ramo para ti 🌷</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-light"></div>

    <!-- PORTADA -->
    <section class="hero">

        <div class="hero-content">

            <p class="eyebrow">PARA TI</p>

            <h1>
                Sé que no es un ramo físico...
            </h1>

            <p class="intro">
                pero te merecías uno.
                <br><br>
                Y cada flor tiene un porqué.
                <br>
                Así que quiero que descubras,
                una a una, las razones de este ramo.
            </p>

            <div class="mini-tulip">
                <img
                    src="ChatGPT Image 21 sept 2026, 22_20_35.png"
                    alt="Tulipán amarillo"
                >
            </div>

            <div class="scroll-message">

                <span>Desliza para descubrirlo</span>

                <div class="arrow">
                    ↓
                </div>

            </div>

        </div>

    </section>


    <!-- HISTORIA -->
    <main class="story">

        <!-- RAMO QUE SE VA FORMANDO -->
        <div class="bouquet-area">

            <div class="bouquet-title">
                Tu ramo
            </div>

            <div class="bouquet-wrapper">

                <div id="bouquet" class="bouquet"></div>

                <div class="wrapper-paper wrapper-left"></div>
                <div class="wrapper-paper wrapper-right"></div>

                <div class="ribbon"></div>

            </div>

        </div>


        <!-- LAS 7 RAZONES -->
        <div id="reasons" class="reasons"></div>

    </main>


    <!-- FINAL -->
    <section class="final-section">

        <div class="final-content">

            <p class="final-small">
                Y después de todas estas razones...
            </p>

            <h2>
                Te quiero
            </h2>

            <div class="heart">
                ❤️
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
